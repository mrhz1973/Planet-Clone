<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Cesium Test Locale</title>

  <script>
    window.CESIUM_BASE_URL = "./node_modules/cesium/Build/Cesium/";
  </script>

  <script src="./node_modules/cesium/Build/Cesium/Cesium.js"></script>
  <link rel="stylesheet" href="./node_modules/cesium/Build/Cesium/Widgets/widgets.css">

  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>

<body>
  <div id="cesiumContainer"></div>

  <script>
    const viewer = new Cesium.Viewer("cesiumContainer", {
      animation: false,
      timeline: false,
      baseLayerPicker: false,
      geocoder: false,
      homeButton: false,
      sceneModePicker: false,
      fullscreenButton: false,
      navigationHelpButton: false,
      terrainProvider: new Cesium.EllipsoidTerrainProvider()
    });

    viewer.imageryLayers.removeAll();

    // Nessuna mappa di base: il globo resta nero finche' non arrivano i tasselli
    // Navionics, cosi' non si intravede nessuna mappa sotto.
    viewer.scene.globe.baseColor = Cesium.Color.BLACK;
    viewer.scene.skyAtmosphere.show = false;

    // --- Strato base: Seachart Navionics (carta nautica, opaca) ---
    // Servito dal proxy Python locale (proxy.py), fa da mappa di base.
    const seachartProvider = new Cesium.UrlTemplateImageryProvider({
      url: "http://localhost:5000/tiles/{z}/{x}/{y}.png",
      minimumLevel: 1,
      maximumLevel: 18,
      credit: "Carte nautiche © Navionics (Garmin) via proxy locale"
    });

    viewer.imageryLayers.addImageryProvider(seachartProvider);

    // --- Overlay: SonarChart Navionics (batimetria, trasparente) ---
    // Si sovrappone alla Seachart; dove non c'e' copertura i tile sono vuoti.
    const sonarProvider = new Cesium.UrlTemplateImageryProvider({
      url: "http://localhost:5000/sonar/{z}/{x}/{y}.png",
      minimumLevel: 1,
      maximumLevel: 18,
      credit: "SonarChart © Navionics (Garmin) via proxy locale"
    });

    const sonarLayer = viewer.imageryLayers.addImageryProvider(sonarProvider);
    // Imposta a false per nascondere la SonarChart e vedere solo la carta nautica.
    sonarLayer.show = true;

    // Golfo di Napoli: zona costiera, ideale per vedere subito la carta nautica
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(14.25, 40.75, 80000)
    });
  </script>
</body>
</html>
